<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-label="Main menu of OpenCode Infinite">
  <rect width="800" height="420" rx="10" fill="#0c0c0c"/>
  <rect width="800" height="30" rx="10" fill="#202020"/>
  <rect y="20" width="800" height="10" fill="#202020"/>
  <text x="16" y="20" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#9a9a9a">OpenCode Infinite</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#e6e6e6" style="white-space:pre">
    <text x="20" y="62" fill="#4fc3f7">OpenCode Infinite  v2.33   Main menu</text>
    <text x="20" y="84" fill="#7a7a7a">Egress: WARP   Mode: CLI   Language: English</text>
    <text x="20" y="120" fill="#e6e6e6">  1  New IP and start OpenCode</text>
    <text x="20" y="146" fill="#e6e6e6">  2  Clear tokens and cache, then start</text>
    <text x="20" y="172" fill="#e6e6e6">  3  Change IP (test)</text>
    <text x="20" y="198" fill="#e6e6e6">  4  Deep reset or restore chats</text>
    <text x="20" y="224" fill="#e6e6e6">  5  Mode (CLI or Desktop)</text>
    <text x="20" y="250" fill="#e6e6e6">  6  Back</text>
    <text x="20" y="276" fill="#ff8a80">  7  Exit</text>
    <text x="20" y="316" fill="#ffd54f">Enter selects  -  arrows move  -  Esc goes back  -  Ctrl+C quits</text>
  </g>
  <text x="20" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6f6f6f">Mockup drawn from the launcher's own menu text. Not a photo of a real screen.</text>
</svg>
