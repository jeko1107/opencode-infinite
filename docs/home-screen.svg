<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="Home screen of OpenCode Infinite">
  <rect width="800" height="400" rx="10" fill="#0c0c0c"/>
  <rect width="800" height="30" rx="10" fill="#202020"/>
  <rect y="20" width="800" height="10" fill="#202020"/>
  <text x="16" y="20" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#9a9a9a">OpenCode Infinite</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="15" style="white-space:pre">
    <text x="20" y="62" fill="#4fc3f7">OpenCode  v2.33</text>
